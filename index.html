<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flux TCG Collector App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Flux TCG</h2>

    <nav>
      <button onclick="showPage('inventory')">Inventory</button>
      <button onclick="showPage('sales')">Sales</button>
      <button onclick="showPage('summary')">Summary</button>
      <button onclick="showPage('suppliers')">Suppliers</button>
      <button onclick="showPage('trades')">Trades</button>
    </nav>

    <div class="tax-info">
      <h3>Tax Summary</h3>
      <div id="taxSummary"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- INVENTORY PAGE -->
    <section id="inventoryPage" class="page">
      <h1>Inventory</h1>

      <form id="inventoryForm">
        <input type="text" id="invName" placeholder="Product name" required>
        <input type="text" id="invCategory" placeholder="Category" required>
        <input type="text" id="invSupplier" placeholder="Supplier" required>

        <input type="number" step="0.01" id="invBuyPrice" placeholder="Buy price (£)" required>
        <input type="number" step="0.01" id="invSellPrice" placeholder="Sell price (£)" required>
        <input type="number" id="invQuantity" placeholder="Quantity" required>

        <input type="number" step="0.01" id="invMarketPrice" placeholder="UK market price (£)" required>

        <!-- PRODUCT IMAGE -->
        <input type="text" id="invImage" placeholder="Image URL (card picture)" required>

        <textarea id="invNotes" placeholder="Notes / strategy"></textarea>

        <button type="submit">Add to inventory</button>
      </form>

      <div id="inventoryList"></div>
    </section>

    <!-- SALES PAGE (FIXED ID) -->
    <section id="salesPage" class="page" style="display:none">
      <h1>Sales</h1>
      <div id="salesList"></div>
    </section>

    <!-- SUMMARY PAGE -->
    <section id="summaryPage" class="page" style="display:none">
      <!-- summary.js will fill this -->
    </section>

    <!-- SUPPLIERS PAGE -->
    <section id="suppliersPage" class="page" style="display:none">
      <!-- suppliers.js will fill this -->
    </section>

    <!-- TRADES PAGE -->
    <section id="tradesPage" class="page" style="display:none">
      <!-- trades.js will fill this -->
    </section>

  </main>
</div>

<script src="data.js"></script>
<script src="inventory.js"></script>
<script src="sales.js"></script>
<script src="summary.js"></script>
<script src="suppliers.js"></script>
<script src="trades.js"></script>

<script>
  function showPage(page) {
    document.getElementById('inventoryPage').style.display =
      page === 'inventory' ? 'block' : 'none';

    document.getElementById('salesPage').style.display =
      page === 'sales' ? 'block' : 'none';

    document.getElementById('summaryPage').style.display =
      page === 'summary' ? 'block' : 'none';

    document.getElementById('suppliersPage').style.display =
      page === 'suppliers' ? 'block' : 'none';

    document.getElementById('tradesPage').style.display =
      page === 'trades' ? 'block' : 'none';

    if (page === 'summary') renderSummary();
    if (page === 'suppliers') renderSuppliers();
    if (page === 'trades') renderTrades();
  }

  // Load everything on startup
  showPage('inventory');
  renderInventory();
  renderSalesInventory();
  renderTaxSummary();
</script>

</body>
</html>
