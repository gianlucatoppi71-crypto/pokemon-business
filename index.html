<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gianluca Pokémon Business</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Gianluca Pokémon Business</h1>
  <nav>
    <button onclick="showView('inventory')">Inventory</button>
    <button onclick="showView('singles')">Singles</button>
    <button onclick="showView('trades')">Trades</button>
    <button onclick="showView('suppliers')">Suppliers</button>
    <button onclick="showView('summary')">Summary</button>
    <button onclick="showView('sales')">Sales</button>
  </nav>
</header>

<main>
  <section id="inventory" class="view"></section>
  <section id="singles" class="view hidden"></section>
  <section id="trades" class="view hidden"></section>
  <section id="suppliers" class="view hidden"></section>
  <section id="summary" class="view hidden"></section>
  <section id="sales" class="view hidden"></section>
</main>

<script src="data.js"></script>
<script src="inventory.js"></script>
<script src="singles.js"></script>
<script src="trades.js"></script>
<script src="suppliers.js"></script>
<script src="summary.js"></script>
<script src="chart.js"></script>
<script src="sales.js"></script>

<script>
function showView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

window.onload = function(){
  initInventory();
  initSingles();
  initTrades();
  initSuppliers();
  initSummary();
  initSales(); 
};
</script>

</body>
</html>
