<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gianluca Pokémon Business</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h2 class="logo">Pokémon Business</h2>

        <button class="nav-btn" onclick="loadPage('inventory')">Inventory</button>
        <button class="nav-btn" onclick="loadPage('sales')">Sales</button>
        <button class="nav-btn" onclick="loadPage('singles')">Singles</button>
        <button class="nav-btn" onclick="loadPage('trades')">Trades</button>
        <button class="nav-btn" onclick="loadPage('suppliers')">Suppliers</button>
        <button class="nav-btn" onclick="loadPage('summary')">Summary</button>
    </div>

    <!-- MAIN CONTENT -->
    <div id="content">
        <h1>Welcome to Gianluca Pokémon Business</h1>
        <p>Select a section from the sidebar.</p>
    </div>

    <!-- SCRIPTS -->
    <script src="data.js"></script>
    <script src="inventory.js"></script>
    <script src="sales.js"></script>
    <script src="singles.js"></script>
    <script src="trades.js"></script>
    <script src="suppliers.js"></script>
    <script src="summary.js"></script>

    <script>
        function loadPage(page) {
            if (page === "inventory") loadInventory();
            if (page === "sales") loadSales();
            if (page === "singles") loadSingles();
            if (page === "trades") loadTrades();
            if (page === "suppliers") loadSuppliers();
            if (page === "summary") loadSummary();
        }
    </script>

</body>
</html>
