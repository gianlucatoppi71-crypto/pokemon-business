<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flux TCG Collector App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- INVENTORY PAGE -->
  <section id="inventoryPage" class="page">
    <h1>Inventory</h1>

    <form id="inventoryForm" onsubmit="addInventoryItem(event)">

      <label>Product Name</label>
      <input type="text" id="productName" required>

      <label>Category</label>
      <input type="text" id="productCategory">

      <label>Supplier</label>
      <input type="text" id="productSupplier">

      <label>Buy Price (per BOX)</label>
      <input type="number" id="buyPriceBox" step="0.01">

      <label>Sell Price (per BOX)</label>
      <input type="number" id="sellPriceBox" step="0.01">

      <label>Sell Price (per PACK)</label>
      <input type="number" id="sellPricePack" step="0.01">

      <label>Packs per Box</label>
      <input type="number" id="packsPerBox">

      <label>Quantity of Boxes</label>
      <input type="number" id="quantityBoxes">

      <label>Loose Packs</label>
      <input type="number" id="loosePacks">

      <label>Market Price (UK)</label>
      <input type="number" id="marketPrice" step="0.01">

      <label>Notes</label>
      <textarea id="notes"></textarea>

      <button type="submit">Add Inventory</button>

    </form>

    <div id="inventoryList"></div>
  </section>

  <script src="inventory.js"></script>

</body>
</html>
